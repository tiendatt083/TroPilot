spring.application.name=Tropilot
server.port=${SERVER_PORT:8080}
debug=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.hibernate.SQL=INFO

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tropilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=${SPRING_FLYWAY_BASELINE_VERSION:1}
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_WRITE_TIMEOUT:5000}
app.mail.from=${APP_MAIL_FROM:}

spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:10MB}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.upload.base-path=${APP_UPLOAD_BASE_PATH:uploads}

app.jwt.secret=${APP_JWT_SECRET:TropilotJwtSecretForAcademicProjectChangeBeforeProduction2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}
app.temporary-password.encryption-secret=${APP_TEMPORARY_PASSWORD_ENCRYPTION_SECRET}

app.sepay.enabled=${APP_SEPAY_ENABLED:false}
app.sepay.qr-base-url=${APP_SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
app.sepay.bank-code=${APP_SEPAY_BANK_CODE:}
app.sepay.account-number=${APP_SEPAY_ACCOUNT_NUMBER:}
app.sepay.account-name=${APP_SEPAY_ACCOUNT_NAME:}
app.sepay.qr-template=${APP_SEPAY_QR_TEMPLATE:compact}
app.sepay.payment-code-prefix=${APP_SEPAY_PAYMENT_CODE_PREFIX:TPINV}
app.sepay.webhook-secret=${APP_SEPAY_WEBHOOK_SECRET:}

app.gemini.enabled=${APP_GEMINI_ENABLED:false}
app.gemini.api-key=${APP_GEMINI_API_KEY:}
app.gemini.base-url=${APP_GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
app.gemini.model=${APP_GEMINI_MODEL:gemini-2.5-flash-lite}
app.gemini.fallback-models=${APP_GEMINI_FALLBACK_MODELS:gemini-flash-lite-latest,gemini-3.1-flash-lite}
app.gemini.connect-timeout-seconds=${APP_GEMINI_CONNECT_TIMEOUT_SECONDS:10}
app.gemini.read-timeout-seconds=${APP_GEMINI_READ_TIMEOUT_SECONDS:30}
app.gemini.max-history-messages=${APP_GEMINI_MAX_HISTORY_MESSAGES:8}
