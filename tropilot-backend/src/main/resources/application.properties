spring.application.name=Tropilot
server.port=${SERVER_PORT:8080}
debug=false
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot.autoconfigure=INFO
logging.level.org.hibernate.SQL=INFO

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tropilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_STARTTLS_ENABLE:false}

spring.servlet.multipart.max-file-size=${APP_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${APP_MAX_REQUEST_SIZE:10MB}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.upload.base-path=${APP_UPLOAD_BASE_PATH:uploads}

app.jwt.secret=${APP_JWT_SECRET:TropilotJwtSecretForAcademicProjectChangeBeforeProduction2026}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:1440}
app.temporary-password.encryption-secret=${APP_TEMPORARY_PASSWORD_ENCRYPTION_SECRET:TropilotTemporaryPasswordEncryptionSecretChangeBeforeProduction2026}

app.sepay.enabled=${APP_SEPAY_ENABLED:false}
app.sepay.qr-base-url=${APP_SEPAY_QR_BASE_URL:https://qr.sepay.vn/img}
app.sepay.bank-code=${APP_SEPAY_BANK_CODE:}
app.sepay.account-number=${APP_SEPAY_ACCOUNT_NUMBER:}
app.sepay.account-name=${APP_SEPAY_ACCOUNT_NAME:}
app.sepay.qr-template=${APP_SEPAY_QR_TEMPLATE:compact}
app.sepay.payment-code-prefix=${APP_SEPAY_PAYMENT_CODE_PREFIX:TPINV}
app.sepay.webhook-secret=${APP_SEPAY_WEBHOOK_SECRET:}
