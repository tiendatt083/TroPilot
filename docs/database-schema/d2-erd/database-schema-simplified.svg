<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1320" viewBox="0 0 2200 1320" role="img" aria-labelledby="title desc">
  <title id="title">Tropilot — Simplified Final Entity Relationship Diagram</title>
  <desc id="desc">White-background entity relationship overview containing all 28 final Flyway tables and their foreign-key columns.</desc>
  <defs>
    <style>
      .bg{fill:#fff}.title{font:700 29px Arial,sans-serif;fill:#172033}.sub{font:15px Arial,sans-serif;fill:#52657a}.domain{fill:#fff;stroke:#94a3b8;stroke-width:1.6;stroke-dasharray:6 5}.domainTitle{font:700 18px Arial,sans-serif;fill:#334155}.table{fill:#fff;stroke:#64748b;stroke-width:1.4}.thead{fill:#f8fafc;stroke:#64748b;stroke-width:1.4}.tname{font:700 14px Arial,sans-serif;fill:#172033}.row{font:12px Arial,sans-serif;fill:#334155}.pk{font:700 12px Arial,sans-serif;fill:#0f4c81}.fk{font:12px Arial,sans-serif;fill:#7c4a03}.line{stroke:#64748b;stroke-width:1.4;fill:none}.muted{stroke:#a8b3c1;stroke-width:1.2;fill:none;stroke-dasharray:5 4}.legend{font:12px Arial,sans-serif;fill:#475569}.note{font:12px Arial,sans-serif;fill:#5b6471}
    </style>
