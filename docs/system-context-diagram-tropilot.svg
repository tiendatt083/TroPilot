<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1080" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">Tropilot System Context Diagram</title>
  <desc id="desc">A system context diagram showing Tropilot, its user roles and its external services.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#27415f"/></marker>
    <marker id="arrowGreen" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M0 0 L10 6 L0 12 Z" fill="#358a67"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="124%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity=".17"/></filter>
    <style>
      .title{font:700 41px Arial,sans-serif;fill:#172033}.subtitle{font:400 21px Arial,sans-serif;fill:#5e6a7e}.heading{font:700 27px Arial,sans-serif;fill:#172033}.cardTitle{font:700 22px Arial,sans-serif;fill:#172033}.body{font:400 18px Arial,sans-serif;fill:#33445b}.small{font:600 16px Arial,sans-serif;fill:#33445b}.flow{font:700 16px Arial,sans-serif;fill:#41536a}.line{fill:none;stroke:#27415f;stroke-width:3;marker-end:url(#arrowBlue)}.green{fill:none;stroke:#358a67;stroke-width:3;marker-end:url(#arrowGreen)}.dash{fill:none;stroke:#657995;stroke-width:2.5;stroke-dasharray:9 7;marker-end:url(#arrowBlue)}
    </style>
  </defs>
  <rect width="1800" height="1080" fill="#fff"/>
  <text x="70" y="70" class="title">5.2 System Context Diagram — Tropilot</text>
  <text x="70" y="105" class="subtitle">Actors and external systems that interact with the Tropilot rental property operations platform</text>

  <!-- user area -->
  <rect x="55" y="165" width="385" height="795" rx="22" fill="#eef5ff" stroke="#79a8dc" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="84" y="213" class="heading">Users / Actors</text>
  <text x="84" y="243" class="subtitle">System users</text>

  <rect x="92" y="290" width="310" height="165" rx="18" fill="#fff" stroke="#a4c2e5" filter="url(#shadow)"/>
  <circle cx="150" cy="355" r="35" fill="#345fa8"/><circle cx="150" cy="343" r="11" fill="#fff"/><path d="M128 380c4-17 40-17 44 0" fill="#fff"/><path d="M139 345h22M150 334v22" stroke="#345fa8" stroke-width="2"/>
  <text x="205" y="342" class="cardTitle">Administrator</text><text x="205" y="371" class="body">Manages buildings and users,</text><text x="205" y="397" class="body">contracts and revenue</text>

  <rect x="92" y="495" width="310" height="165" rx="18" fill="#fff" stroke="#a4c2e5" filter="url(#shadow)"/>
  <circle cx="150" cy="560" r="35" fill="#d48a2b"/><circle cx="150" cy="548" r="11" fill="#fff"/><path d="M128 585c4-17 40-17 44 0" fill="#fff"/><path d="M137 536h26v7h-26z" fill="#fff"/>
  <text x="205" y="547" class="cardTitle">Staff</text><text x="205" y="576" class="body">Manages rooms and invoices,</text><text x="205" y="602" class="body">tasks and maintenance</text>

  <rect x="92" y="700" width="310" height="165" rx="18" fill="#fff" stroke="#a4c2e5" filter="url(#shadow)"/>
  <circle cx="150" cy="765" r="35" fill="#8565c4"/><circle cx="150" cy="753" r="11" fill="#fff"/><path d="M128 790c4-17 40-17 44 0" fill="#fff"/><path d="M137 742h26v6h-26z" fill="#fff"/>
  <text x="205" y="752" class="cardTitle">Resident</text><text x="205" y="781" class="body">Views rooms and invoices,</text><text x="205" y="807" class="body">submits requests and payments</text>

  <!-- central system boundary -->
  <rect x="545" y="205" width="700" height="655" rx="28" fill="#fff9df" stroke="#d9b950" stroke-width="4" filter="url(#shadow)"/>
  <rect x="545" y="205" width="700" height="82" rx="28" fill="#f7d96c"/>
  <path d="M545 260h700" stroke="#d9b950" stroke-width="2"/>
  <text x="895" y="256" text-anchor="middle" class="heading">TROPILOT SYSTEM</text>
  <text x="895" y="322" text-anchor="middle" class="cardTitle">Rental Property Operations Management System</text>
  <text x="895" y="353" text-anchor="middle" class="body">Web application for administrators, staff and residents</text>

  <rect x="600" y="400" width="590" height="120" rx="18" fill="#fff" stroke="#dfc768"/>
  <circle cx="665" cy="460" r="29" fill="#61dafb"/><g fill="none" stroke="#172033" stroke-width="2.5"><ellipse cx="665" cy="460" rx="22" ry="8"/><ellipse cx="665" cy="460" rx="22" ry="8" transform="rotate(60 665 460)"/><ellipse cx="665" cy="460" rx="22" ry="8" transform="rotate(120 665 460)"/></g><circle cx="665" cy="460" r="3" fill="#172033"/>
  <text x="735" y="450" class="cardTitle">Frontend — React + Vite</text><text x="735" y="480" class="body">Role-based SPA · dashboards · forms · payment view</text>

  <rect x="600" y="555" width="590" height="120" rx="18" fill="#fff" stroke="#dfc768"/>
  <circle cx="665" cy="615" r="29" fill="#6db33f"/><path d="M653 600c18 4 21 21 4 30 7-12-4-20-15-16 4-6 7-10 11-14z" fill="#fff"/><path d="M668 601c8 9 4 21-5 25" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="735" y="605" class="cardTitle">Backend — Spring Boot REST API</text><text x="735" y="635" class="body">JWT security · business services · validation · integrations</text>

  <rect x="600" y="710" width="285" height="100" rx="18" fill="#eef8ef" stroke="#8bbb89"/>
  <circle cx="650" cy="760" r="23" fill="#315e9d"/><ellipse cx="650" cy="752" rx="11" ry="4" fill="#fff"/><path d="M639 752v15c0 5 22 5 22 0v-15M639 758c0 5 22 5 22 0" fill="none" stroke="#fff" stroke-width="2"/>
  <text x="770" y="753" text-anchor="middle" class="cardTitle">MySQL Database</text><text x="770" y="782" text-anchor="middle" class="body">Operational data</text>
  <rect x="905" y="710" width="285" height="100" rx="18" fill="#fff3f5" stroke="#d78ca1"/>
  <circle cx="955" cy="760" r="23" fill="#d76683"/><path d="M941 750h11l5 5h12v15h-28z" fill="#fff"/>
  <text x="1070" y="753" text-anchor="middle" class="cardTitle">File Storage</text><text x="1070" y="782" text-anchor="middle" class="body">Contracts &amp; payment proofs</text>

  <!-- external systems -->
  <rect x="1350" y="165" width="395" height="795" rx="22" fill="#fff2ef" stroke="#dc9a91" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="1380" y="213" class="heading">External Systems</text>
  <text x="1380" y="243" class="subtitle">Integrated services</text>

  <rect x="1387" y="290" width="320" height="135" rx="18" fill="#fff" stroke="#e5b5ad" filter="url(#shadow)"/>
  <circle cx="1446" cy="358" r="30" fill="#1f6ccc"/><rect x="1429" y="347" width="34" height="23" rx="3" fill="none" stroke="#fff" stroke-width="3"/><path d="M1430 354h32" stroke="#fff" stroke-width="3"/>
  <text x="1500" y="346" class="cardTitle">SePay</text><text x="1500" y="375" class="body">Receives payment status</text><text x="1500" y="400" class="body">through webhooks</text>

  <rect x="1387" y="470" width="320" height="135" rx="18" fill="#fff" stroke="#e5b5ad" filter="url(#shadow)"/>
  <circle cx="1446" cy="538" r="30" fill="#7057d6"/><path d="M1446 512l5 20 20 6-20 5-5 21-6-21-20-5 20-6z" fill="#fff"/>
  <text x="1500" y="526" class="cardTitle">Google Gemini API</text><text x="1500" y="555" class="body">Provides chatbot responses</text><text x="1500" y="580" class="body">within role-based context</text>

  <rect x="1387" y="650" width="320" height="135" rx="18" fill="#fff" stroke="#e5b5ad" filter="url(#shadow)"/>
  <circle cx="1446" cy="718" r="30" fill="#2d87d6"/><path d="M1428 705h36v27h-36zM1428 705l18 15 18-15" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1500" y="706" class="cardTitle">SMTP / Email Service</text><text x="1500" y="735" class="body">Sends notifications and</text><text x="1500" y="760" class="body">password-reset emails</text>

  <rect x="1387" y="830" width="320" height="85" rx="18" fill="#fff" stroke="#e5b5ad"/>
  <circle cx="1446" cy="872" r="25" fill="#f48120"/><path d="M1430 878h33c4 0 5-8 0-10-2-9-15-10-19-3-8-3-15 4-14 13z" fill="#fff"/>
  <text x="1500" y="866" class="cardTitle">Cloudflare Tunnel</text><text x="1500" y="892" class="body">Provides demo access</text>

  <!-- flows, user to system -->
  <path d="M402 372 H495 V440 H600" class="line"/><text x="430" y="349" class="flow">Manage operations</text>
  <path d="M402 577 H515 V500 H600" class="line"/><text x="432" y="555" class="flow">Operate property</text>
  <path d="M402 782 H495 V615 H600" class="line"/><text x="428" y="760" class="flow">Use services</text>

  <!-- flows, system to external -->
  <path d="M1190 615 H1300 V358 H1387" class="dash"/><text x="1243" y="340" class="flow">Payment reference</text><text x="1255" y="363" class="flow">Webhook status</text>
  <path d="M1190 615 H1270 V538 H1387" class="dash"/><text x="1230" y="520" class="flow">Chat request / answer</text>
  <path d="M1190 615 H1300 V718 H1387" class="dash"/><text x="1227" y="700" class="flow">Send notification</text>
  <path d="M1190 460 H1320 V872 H1387" class="dash"/><text x="1265" y="852" class="flow">Optional public access</text>

  <!-- internal data flow -->
  <path d="M895 675 V710 H885" class="green"/><path d="M1035 675 V710" class="green"/>
  <text x="70" y="1025" class="small">Scope note: MySQL and local file storage are internal Tropilot resources; SePay, Gemini, email and Cloudflare are external services.</text>
</svg>
