<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Tropilot System Architecture</title>
  <desc id="desc">Layered system architecture of Tropilot, comprising a React frontend, Spring Boot backend, MySQL data layer and external integrations.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#25354b"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".16"/></filter>
    <style>
      .title{font:700 39px Arial,sans-serif;fill:#172033}.subtitle{font:400 20px Arial,sans-serif;fill:#5d6678}.layer{font:700 24px Arial,sans-serif;fill:#172033}.boxTitle{font:700 21px Arial,sans-serif;fill:#172033}.body{font:400 17px Arial,sans-serif;fill:#354156}.small{font:600 16px Arial,sans-serif;fill:#354156}.tag{font:700 16px Arial,sans-serif;fill:#25354b}.line{fill:none;stroke:#25354b;stroke-width:3;marker-end:url(#arrow)}.thin{fill:none;stroke:#56657c;stroke-width:2.5;stroke-dasharray:8 7;marker-end:url(#arrow)}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>
  <text x="70" y="65" class="title">5.1 System Architecture — Tropilot</text>
  <text x="70" y="98" class="subtitle">Hệ thống quản lý vận hành nhà/phòng cho thuê · Client–Server · Layered Monolith</text>

  <!-- Presentation layer -->
  <rect x="55" y="135" width="455" height="815" rx="16" fill="#eef5ff" stroke="#7ca6d9" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="82" y="176" class="layer">Presentation Layer (Frontend)</text>
  <text x="82" y="203" class="subtitle">React single-page application</text>
  <rect x="92" y="240" width="380" height="105" rx="14" fill="#ffffff" stroke="#7398cf" filter="url(#shadow)"/>
  <circle cx="132" cy="290" r="25" fill="#172033"/>
  <g fill="none" stroke="#61dafb" stroke-width="2.5"><ellipse cx="132" cy="290" rx="20" ry="8"/><ellipse cx="132" cy="290" rx="20" ry="8" transform="rotate(60 132 290)"/><ellipse cx="132" cy="290" rx="20" ry="8" transform="rotate(120 132 290)"/></g><circle cx="132" cy="290" r="3.5" fill="#61dafb"/>
  <text x="170" y="282" class="boxTitle">React + Vite SPA</text><text x="170" y="311" class="body">Responsive web user interface</text>
  <rect x="92" y="380" width="380" height="105" rx="14" fill="#ffffff" stroke="#7398cf" filter="url(#shadow)"/>
  <circle cx="132" cy="430" r="25" fill="#4169b1"/><path d="M118 439 C123 425,128 437,133 423 S143 433,147 419" fill="none" stroke="#fff" stroke-width="2.7"/><circle cx="118" cy="439" r="3" fill="#fff"/><circle cx="147" cy="419" r="3" fill="#fff"/>
  <text x="170" y="422" class="boxTitle">React Router</text><text x="170" y="451" class="body">Role-based routes &amp; protected pages</text>
  <rect x="92" y="520" width="380" height="105" rx="14" fill="#ffffff" stroke="#7398cf" filter="url(#shadow)"/>
  <circle cx="132" cy="570" r="25" fill="#8565c4"/><circle cx="121" cy="559" r="4" fill="#fff"/><circle cx="143" cy="559" r="4" fill="#fff"/><circle cx="121" cy="581" r="4" fill="#fff"/><circle cx="143" cy="581" r="4" fill="#fff"/><path d="M125 559h14M121 563v14M143 563v14M125 581h14" stroke="#fff" stroke-width="2"/>
  <text x="170" y="562" class="boxTitle">Context &amp; Hooks</text><text x="170" y="591" class="body">Authentication, theme, API state</text>
  <rect x="92" y="660" width="380" height="105" rx="14" fill="#ffffff" stroke="#7398cf" filter="url(#shadow)"/>
  <circle cx="132" cy="710" r="25" fill="#6b5ad8"/><path d="M122 717l10-21 8 12 7-12" stroke="#fff" stroke-width="3" fill="none"/><circle cx="122" cy="717" r="2.5" fill="#fff"/><circle cx="147" cy="696" r="2.5" fill="#fff"/>
  <text x="170" y="702" class="boxTitle">Axios API Client</text><text x="170" y="731" class="body">REST calls, token attachment, errors</text>
  <rect x="92" y="800" width="380" height="105" rx="14" fill="#dceaff" stroke="#7398cf"/>
  <text x="282" y="839" text-anchor="middle" class="boxTitle">User roles</text><text x="282" y="873" text-anchor="middle" class="body">ADMIN · STAFF · RESIDENT / RESIDENT_HEAD</text>

  <!-- External services -->
  <rect x="570" y="135" width="1175" height="195" rx="16" fill="#fff3f0" stroke="#d69a90" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="598" y="176" class="layer">External Services &amp; Integrations</text>
  <rect x="605" y="208" width="230" height="85" rx="12" fill="#fff" stroke="#ddaca4"/><circle cx="642" cy="250" r="22" fill="#7057d6"/><path d="M642 231l4 15 15 4-15 4-4 15-4-15-15-4 15-4z" fill="#fff"/><text x="737" y="244" text-anchor="middle" class="boxTitle">Gemini API</text><text x="737" y="270" text-anchor="middle" class="body">Read-only chatbot</text>
  <rect x="870" y="208" width="230" height="85" rx="12" fill="#fff" stroke="#ddaca4"/><circle cx="907" cy="250" r="22" fill="#1f6ccc"/><rect x="894" y="241" width="26" height="18" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M895 247h24" stroke="#fff" stroke-width="2.5"/><text x="1002" y="244" text-anchor="middle" class="boxTitle">SePay</text><text x="1002" y="270" text-anchor="middle" class="body">Payment &amp; webhook</text>
  <rect x="1135" y="208" width="230" height="85" rx="12" fill="#fff" stroke="#ddaca4"/><circle cx="1172" cy="250" r="22" fill="#2d87d6"/><path d="M1159 240h26v20h-26zM1159 240l13 11 13-11" fill="none" stroke="#fff" stroke-width="2.5"/><text x="1267" y="244" text-anchor="middle" class="boxTitle">SMTP / Email</text><text x="1267" y="270" text-anchor="middle" class="body">Notifications &amp; reset</text>
  <rect x="1400" y="208" width="300" height="85" rx="12" fill="#fff" stroke="#ddaca4"/><circle cx="1442" cy="250" r="22" fill="#f48120"/><path d="M1428 255h29c4 0 5-7 0-9-1-8-13-10-17-3-7-3-13 3-12 8z" fill="#fff"/><text x="1567" y="244" text-anchor="middle" class="boxTitle">Cloudflare Tunnel</text><text x="1567" y="270" text-anchor="middle" class="body">Optional public access</text>

  <!-- Application layer -->
  <rect x="570" y="375" width="1175" height="575" rx="16" fill="#fff9df" stroke="#d9b950" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="598" y="418" class="layer">Application Layer (Backend)</text>
  <text x="598" y="445" class="subtitle">Spring Boot 3 · Java 17 · RESTful API</text>
  <rect x="615" y="485" width="240" height="165" rx="14" fill="#fff" stroke="#d8bd63" filter="url(#shadow)"/>
  <circle cx="735" cy="516" r="20" fill="#f09b22"/><rect x="725" y="514" width="20" height="14" rx="2" fill="#fff"/><path d="M729 514v-5a6 6 0 0112 0v5" fill="none" stroke="#fff" stroke-width="2.5"/><text x="735" y="554" text-anchor="middle" class="boxTitle">Spring Security</text><text x="735" y="582" text-anchor="middle" class="body">JWT authentication</text><text x="735" y="608" text-anchor="middle" class="body">RBAC authorization</text><text x="735" y="632" text-anchor="middle" class="small">Roles &amp; room access control</text>
  <rect x="900" y="485" width="280" height="165" rx="14" fill="#fff" stroke="#d8bd63" filter="url(#shadow)"/>
  <circle cx="1040" cy="516" r="20" fill="#3886d1"/><text x="1040" y="524" text-anchor="middle" style="font:700 23px Arial;fill:#fff">{ }</text><text x="1040" y="554" text-anchor="middle" class="boxTitle">REST Controllers</text><text x="1040" y="582" text-anchor="middle" class="body">HTTP request / response</text><text x="1040" y="608" text-anchor="middle" class="body">Validation &amp; DTO mapping</text><text x="1040" y="632" text-anchor="middle" class="small">/api/** endpoints</text>
  <rect x="1225" y="485" width="470" height="165" rx="14" fill="#fff" stroke="#d8bd63" filter="url(#shadow)"/>
  <circle cx="1460" cy="516" r="20" fill="#6db33f"/><path d="M1453 505c13 3 16 15 3 21 5-8-3-13-10-11 3-4 5-7 7-10z" fill="#fff"/><path d="M1462 505c6 7 3 15-4 18" fill="none" stroke="#fff" stroke-width="2"/><text x="1460" y="554" text-anchor="middle" class="boxTitle">Business Service Layer</text><text x="1460" y="582" text-anchor="middle" class="body">Rooms · contracts · invoices · payments · maintenance</text><text x="1460" y="608" text-anchor="middle" class="body">vehicles · tasks · equipment · notifications · chatbot</text><text x="1460" y="632" text-anchor="middle" class="small">Business rules, audit logs &amp; integrations</text>
  <rect x="615" y="715" width="510" height="175" rx="14" fill="#fff" stroke="#d8bd63" filter="url(#shadow)"/>
  <circle cx="870" cy="745" r="19" fill="#315e9d"/><ellipse cx="870" cy="738" rx="10" ry="4" fill="#fff"/><path d="M860 738v13c0 5 20 5 20 0v-13M860 744c0 5 20 5 20 0" fill="none" stroke="#fff" stroke-width="2"/><text x="870" y="780" text-anchor="middle" class="boxTitle">Persistence &amp; Support Components</text><text x="870" y="810" text-anchor="middle" class="body">Spring Data JPA repositories · entity · DTO · mapper</text><text x="870" y="838" text-anchor="middle" class="body">Validation · global exception handler · configuration</text><text x="870" y="868" text-anchor="middle" class="small">Layered Controller → Service → Repository design</text>
  <rect x="1170" y="715" width="525" height="175" rx="14" fill="#fff" stroke="#d8bd63" filter="url(#shadow)"/>
  <circle cx="1432" cy="745" r="19" fill="#d76683"/><path d="M1420 737h10l4 4h10v13h-24z" fill="#fff"/><text x="1432" y="780" text-anchor="middle" class="boxTitle">Storage &amp; Integration Adapters</text><text x="1432" y="810" text-anchor="middle" class="body">Contract files · payment proofs · maintenance images</text><text x="1432" y="838" text-anchor="middle" class="body">Gemini client · SePay service · email services</text><text x="1432" y="868" text-anchor="middle" class="small">Local file storage &amp; third-party API adapters</text>

  <!-- Data layer -->
  <rect x="570" y="980" width="1175" height="105" rx="16" fill="#f0faee" stroke="#7ab678" stroke-width="3" stroke-dasharray="9 7"/>
  <text x="598" y="1021" class="layer">Data Layer (Database &amp; Storage)</text>
  <rect x="990" y="997" width="300" height="70" rx="12" fill="#fff" stroke="#8dbb8b"/><text x="1140" y="1027" text-anchor="middle" class="boxTitle">MySQL 8.4 Database</text><text x="1140" y="1052" text-anchor="middle" class="body">Relational data via JPA</text>
  <rect x="1320" y="997" width="190" height="70" rx="12" fill="#fff" stroke="#8dbb8b"/><text x="1415" y="1027" text-anchor="middle" class="boxTitle">Flyway</text><text x="1415" y="1052" text-anchor="middle" class="body">Schema migration</text>
  <rect x="1540" y="997" width="170" height="70" rx="12" fill="#fff" stroke="#8dbb8b"/><text x="1625" y="1027" text-anchor="middle" class="boxTitle">Uploads</text><text x="1625" y="1052" text-anchor="middle" class="body">Local files</text>

  <!-- Flow arrows and labels -->
  <path d="M472 710 H535 V567 H900" class="line"/><text x="520" y="542" class="tag">REST API / JSON</text>
  <path d="M855 567 H900" class="line"/>
  <path d="M1180 567 H1225" class="line"/>
  <path d="M1460 650 V714" class="line"/>
  <path d="M1040 650 V714 H870" class="line"/>
  <path d="M870 890 V1032 H990" class="line"/><text x="882" y="970" class="tag">JPA queries</text>
  <path d="M1432 890 V1032 H1540" class="line"/><text x="1450" y="970" class="tag">file upload</text>
  <path d="M1460 485 V354 H720 V293" class="thin"/><text x="760" y="349" class="tag">chat request</text>
  <path d="M1510 485 V354 H985 V293" class="thin"/><text x="1060" y="349" class="tag">payment webhook</text>
  <path d="M1560 485 V354 H1250 V293" class="thin"/><text x="1310" y="349" class="tag">send email</text>
  <path d="M1050 485 V355 H1550 V293" class="thin"/><text x="1580" y="349" class="tag">public tunnel</text>
</svg>
